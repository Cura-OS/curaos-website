# K8s manifests for the CuraOS public brochure site (cloud / on-prem / hybrid).
#
# The image is built from hosting/nginx/Dockerfile and published to GHCR by the
# deliberate release pipeline (curaos-deploy). The image ref is digest-pinned at
# deploy time; the placeholder below is replaced by the release pipeline.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curaos-website
  labels:
    app.kubernetes.io/name: curaos-website
    app.kubernetes.io/part-of: curaos
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: curaos-website
  template:
    metadata:
      labels:
        app.kubernetes.io/name: curaos-website
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Replaced at release time with ghcr.io/cura-care-oriented-stack/curaos-website@sha256:<digest>
          image: ghcr.io/cura-care-oriented-stack/curaos-website:DIGEST_PINNED_AT_RELEASE
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # NGINX needs write access to these paths even when the root
          # filesystem is read-only; back them with ephemeral emptyDir volumes.
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: curaos-website
  labels:
    app.kubernetes.io/name: curaos-website
spec:
  selector:
    app.kubernetes.io/name: curaos-website
  ports:
    - name: http
      port: 80
      targetPort: 8080
