name: CI

# Automatic PR gate. Until this landed, nothing in this repo ran typecheck,
# lint, or tests on a pull request: the only workflow here was pages.yml, which
# is workflow_dispatch only. Not registered as a required status check.
#
# STANDALONE variant of the fleet Shape B workflow, not the workspace-overlay
# one. This repo is a submodule at the parent ROOT, so it is not a member of the
# parent's bun workspace globs (backend/*, frontend/*, tools/*, test/integration/*)
# and `turbo run build --filter` cannot address it. It also declares zero
# workspace:/file:/link: dependencies, so it installs standalone and needs no
# parent checkout at all. Verified by break-and-revert on this PR rather than
# assumed.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  ci:
    if: github.event.pull_request.draft == false
    runs-on: self-hosted
    steps:
      # SHA-pinned: this repo's own `bash ci.sh` gate runs a pin-guard that fails
      # the build on any action referenced by a floating tag rather than a commit
      # SHA (run 30790962165 reported both of this job's actions as not SHA-pinned).
      # Same pins the existing pages.yml and the sibling curaos-deploy ci.yml use.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Run repo gates
        run: |
          set -euo pipefail
          ran=0
          if node -e "process.exit(require('./package.json').scripts?.ci ? 0 : 1)"; then
            bun run ci
            ran=1
          else
            for s in lint typecheck test build; do
              if node -e "process.exit(require('./package.json').scripts?.$s ? 0 : 1)"; then
                bun run "$s"
                ran=1
              fi
            done
          fi
          # A gate that cannot fail is a failing gate: refuse to report success
          # when package.json declared none of the gates this job exists to run.
          if [ "$ran" -eq 0 ]; then
            echo "::error::no ci/lint/typecheck/test/build script found; this gate would pass vacuously"
            exit 1
          fi
